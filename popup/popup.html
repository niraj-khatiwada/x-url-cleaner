<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X URL Cleaner</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../cleaner.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <h1>X URL Cleaner</h1>
    </header>
    <main>
      <label for="link">Paste a post link</label>
      <textarea id="link" rows="3" placeholder="https://x.com/user/status/123?a=…" spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="hint" autofocus></textarea>
      <p id="hint" class="hint">X and Twitter post links · cleans as you type</p>
      <div class="result-label">
        <span id="result-label">Clean URL</span>
        <button id="copy" type="button" disabled aria-label="Copy clean URL">Copy</button>
      </div>
      <p id="result" tabindex="0" aria-labelledby="result-label"></p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <footer>Private by default. Links stay on this device.</footer>
  </body>
</html>
